# Complete FluxDrive Deployment for Halo Indexer
# This includes all necessary Kubernetes resources for production deployment

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: halo-indexer-config
  namespace: halo-indexer
data:
  NODE_ENV: "production"
  PORT: "3000"
  TLS_API_ENDPOINT: "https://telestai.cryptoscope.io/api"
  LEADER_ELECTION_ENABLED: "true"
  CASSANDRA_ENABLED: "true"
  CASSANDRA_CONTACT_POINTS: "cassandra-service"
  CASSANDRA_DATACENTER: "datacenter1"
  CASSANDRA_KEYSPACE: "halo_indexer"
  CASSANDRA_USERNAME: "cassandra"
  CASSANDRA_PASSWORD: "cassandra"
  REDIS_URL: "redis://redis-service:6379"
  POSTGRES_URL: "postgresql://postgres:password@postgres-service:5432/halo_indexer"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: halo-indexer-secrets
  namespace: halo-indexer
type: Opaque
data:
  # Base64 encoded secrets
  CASSANDRA_PASSWORD: Y2Fzc2FuZHJh  # cassandra
  POSTGRES_PASSWORD: cGFzc3dvcmQ=    # password
  TLS_API_KEY: ""  # Add if needed

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: halo-indexer
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: halo-indexer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Cassandra Service
apiVersion: v1
kind: Service
metadata:
  name: cassandra-service
  namespace: halo-indexer
spec:
  selector:
    app: cassandra
  ports:
    - protocol: TCP
      port: 9042
      targetPort: 9042
  type: ClusterIP

---
# Cassandra Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
      - name: cassandra
        image: cassandra:4.1
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "HaloCluster"
        - name: CASSANDRA_DC
          value: "datacenter1"
        - name: CASSANDRA_RACK
          value: "rack1"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: cassandra-storage
          mountPath: /var/lib/cassandra
      volumes:
      - name: cassandra-storage
        persistentVolumeClaim:
          claimName: cassandra-pvc

---
# Cassandra PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cassandra-pvc
  namespace: halo-indexer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: halo-indexer
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "halo_indexer"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: halo-indexer-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
# PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: halo-indexer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Halo Indexer Service
apiVersion: v1
kind: Service
metadata:
  name: halo-indexer-service
  namespace: halo-indexer
spec:
  selector:
    app: halo-indexer
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
# Halo Indexer Deployment (Lead Node)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-indexer-lead
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-indexer-lead
  template:
    metadata:
      labels:
        app: halo-indexer-lead
    spec:
      containers:
      - name: halo-indexer
        image: halo-indexer:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: halo-indexer-config
        - secretRef:
            name: halo-indexer-secrets
        env:
        - name: NODE_ID
          value: "indexer-lead"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Halo Indexer Deployment (Slave Node 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-indexer-slave-1
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-indexer-slave-1
  template:
    metadata:
      labels:
        app: halo-indexer-slave-1
    spec:
      containers:
      - name: halo-indexer
        image: halo-indexer:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: halo-indexer-config
        - secretRef:
            name: halo-indexer-secrets
        env:
        - name: NODE_ID
          value: "indexer-slave-1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Halo Indexer Deployment (Slave Node 2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-indexer-slave-2
  namespace: halo-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-indexer-slave-2
  template:
    metadata:
      labels:
        app: halo-indexer-slave-2
    spec:
      containers:
      - name: halo-indexer
        image: halo-indexer:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: halo-indexer-config
        - secretRef:
            name: halo-indexer-secrets
        env:
        - name: NODE_ID
          value: "indexer-slave-2"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Load Balancer Service
apiVersion: v1
kind: Service
metadata:
  name: halo-indexer-lb
  namespace: halo-indexer
spec:
  selector:
    app: halo-indexer-lead
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halo-indexer-ingress
  namespace: halo-indexer
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: halo.runonflux.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: halo-indexer-lb
            port:
              number: 80

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: halo-indexer-hpa
  namespace: halo-indexer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: halo-indexer-lead
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: halo-indexer
  labels:
    name: halo-indexer 