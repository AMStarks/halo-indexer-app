global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "halo_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Halo Indexer Metrics
  - job_name: 'halo-indexer'
    static_configs:
      - targets: ['halo-indexer:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # System Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Redis Metrics (if Redis exporter is available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Cassandra Metrics (if Cassandra exporter is available)
  - job_name: 'cassandra'
    static_configs:
      - targets: ['cassandra:9042']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # PostgreSQL Metrics (if PostgreSQL exporter is available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 15s
    metrics_path: '/metrics' 