version: '3.8'

services:
  halo-indexer:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:password@postgres:5432/halo_indexer
      - TLS_API_ENDPOINT=https://api.telestai.io
      - LEADER_ELECTION_ENABLED=true
      - NODE_ID=indexer-1
      - BUNDLE_ID=com.telestai.LASKO
      - ENFORCE_POST_SIGNATURE=true
      - POST_MAX_SKEW_SECONDS=120
      - ALLOW_GLOBAL_FEED=true
    depends_on:
      - redis
      - postgres
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=halo_indexer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: 