# Halo Indexer FluxDrive Deployment Configuration
# This replicates the local deployment for Flux infrastructure

apiVersion: v1
kind: ConfigMap
metadata:
  name: halo-indexer-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  NODE_ID: "indexer-1"
  REDIS_URL: "redis://halo-redis:6379"
  POSTGRES_URL: "postgresql://postgres:password@halo-postgres:5432/halo_indexer"
  TLS_API_ENDPOINT: "https://api.telestai.io"
  LEADER_ELECTION_ENABLED: "true"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-indexer
  namespace: default
  labels:
    app: halo-indexer
    version: v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-indexer
  template:
    metadata:
      labels:
        app: halo-indexer
        version: v1.0.0
    spec:
      containers:
      - name: halo-indexer
        image: halo-indexer:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: halo-indexer-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: halo-indexer-service
  namespace: default
  labels:
    app: halo-indexer
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: halo-indexer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: halo-indexer-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: halo.runonflux.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: halo-indexer-service
            port:
              number: 3000
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-redis
  template:
    metadata:
      labels:
        app: halo-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: halo-redis
  namespace: default
spec:
  selector:
    app: halo-redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halo-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: halo-postgres
  template:
    metadata:
      labels:
        app: halo-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "halo_indexer"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: halo-postgres
  namespace: default
spec:
  selector:
    app: halo-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi 